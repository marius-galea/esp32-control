<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ESP32-C3 Control</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
body{font-family:Arial,sans-serif;background:#f2f2f2;text-align:center;margin:0;padding:25px}
.card{max-width:420px;margin:auto;background:white;padding:28px;border-radius:20px;box-shadow:0 4px 18px rgba(0,0,0,.15)}
h1{margin-top:0}.status{font-size:28px;margin:25px 0}
button{width:90%;padding:18px;margin:10px 0;font-size:22px;border:0;border-radius:12px}
.on{background:#35a853;color:white}.off{background:#555;color:white}
.connected{color:#16803c}.disconnected{color:#c62828}
.small{font-size:14px;color:#666;margin-top:20px}
</style>
</head>
<body>
<div class="card">
<h1>ESP32-C3 CONTROL</h1>
<div class="status">LED STATUS<br><strong id="ledStatus">UNKNOWN</strong></div>
<button class="on" onclick="sendCommand('ON')">💡 TURN ON</button>
<button class="off" onclick="sendCommand('OFF')">TURN OFF</button>
<p>HiveMQ: <strong id="connectionStatus">CONNECTING...</strong></p>
<div class="small">MQTT over secure WebSockets</div>
</div>

<script>
const broker = "wss://2b425261231945f785495606e49d8e51.s1.eu.hivemq.cloud:8884/mqtt";
const username = "web_led";
const password = "084581m!";

const commandTopic = "esp32/led/command";
const statusTopic = "esp32/led/status";

const client = mqtt.connect(broker,{
  username: username,
  password: password,
  clientId: "web-led-" + Math.random().toString(16).slice(2),
  clean: true,
  reconnectPeriod: 5000
});

client.on("connect",()=>{
  document.getElementById("connectionStatus").textContent="CONNECTED";
  document.getElementById("connectionStatus").className="connected";
  client.subscribe(statusTopic);
});

client.on("message",(topic,message)=>{
  if(topic===statusTopic){
    document.getElementById("ledStatus").textContent=message.toString();
  }
});

client.on("offline",()=>{
  document.getElementById("connectionStatus").textContent="OFFLINE";
  document.getElementById("connectionStatus").className="disconnected";
});

client.on("error",(err)=>{
  console.log("MQTT error:",err);
});

function sendCommand(command){
  if(client.connected){
    client.publish(commandTopic,command);
  }else{
    alert("Not connected to HiveMQ.");
  }
}
</script>
</body>
</html>
