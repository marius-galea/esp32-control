<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>ESP32 Actuator Control</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #111;
    color: white;
    text-align: center;
}

.container {
    max-width: 500px;
    margin: auto;
    padding: 25px;
}

h1 {
    margin-bottom: 5px;
}

.subtitle {
    color: #aaa;
    margin-bottom: 25px;
}

.connection {
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 20px;
    background: #333;
    font-weight: bold;
}

.status-box {
    background: #222;
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 30px;
}

.status-label {
    color: #aaa;
    font-size: 14px;
}

.status {
    font-size: 28px;
    font-weight: bold;
    margin-top: 8px;
}

button {
    width: 100%;
    border: none;
    border-radius: 15px;
    color: white;
    font-size: 28px;
    font-weight: bold;
    padding: 25px;
    margin: 10px 0;
    cursor: pointer;
    touch-action: manipulation;
}

button:disabled {
    opacity: 0.35;
    cursor: not-allowed;
}

.extend {
    background: #1677ff;
}

.retract {
    background: #1677ff;
}

.stop {
    background: #d71920;
    font-size: 34px;
    padding: 30px;
}

.message {
    margin-top: 20px;
    min-height: 25px;
    color: #aaa;
}

</style>
</head>

<body>

<div class="container">

    <h1>ACTUATOR CONTROL</h1>

    <div class="subtitle">
        ESP32-C3 Remote Controller
    </div>

    <div id="connection"
         class="connection">
        Connecting...
    </div>

    <div class="status-box">

        <div class="status-label">
            ACTUATOR STATUS
        </div>

        <div id="status"
             class="status">
            UNKNOWN
        </div>

    </div>

    <button id="extend"
            class="extend"
            onclick="sendCommand('EXTEND')"
            disabled>
        ▲ EXTEND
    </button>

    <button id="stop"
            class="stop"
            onclick="sendCommand('STOP')"
            disabled>
        ■ STOP
    </button>

    <button id="retract"
            class="retract"
            onclick="sendCommand('RETRACT')"
            disabled>
        ▼ RETRACT
    </button>

    <div id="message"
         class="message">
    </div>

</div>

<script>

// =====================================================
// HIVEMQ
// =====================================================

const broker =
    "wss://2b425261231945f785495606e49d8e51.s1.eu.hivemq.cloud:8884/mqtt";

const username = "admin";

const password =
    prompt("Enter HiveMQ admin password:");


// =====================================================
// MQTT TOPICS
// =====================================================

const commandTopic =
    "esp32/actuator/command";

const statusTopic =
    "esp32/actuator/status";


// =====================================================
// HTML ELEMENTS
// =====================================================

const connectionElement =
    document.getElementById("connection");

const statusElement =
    document.getElementById("status");

const messageElement =
    document.getElementById("message");

const extendButton =
    document.getElementById("extend");

const stopButton =
    document.getElementById("stop");

const retractButton =
    document.getElementById("retract");


// =====================================================
// MQTT CLIENT
// =====================================================

const clientId =
    "WEB-ACTUATOR-" +
    Math.random()
        .toString(16)
        .substring(2);

const client = mqtt.connect(
    broker,
    {
        clientId: clientId,

        username: username,

        password: password,

        clean: true,

        reconnectPeriod: 3000,

        connectTimeout: 10000,

        keepalive: 30
    }
);


// =====================================================
// MQTT CONNECTED
// =====================================================

client.on("connect", function () {

    console.log("MQTT connected");

    connectionElement.innerText =
        "● MQTT CONNECTED";

    connectionElement.style.background =
        "#145c2a";

    client.subscribe(
        statusTopic,
        function (err) {

            if (err) {

                console.error(
                    "Subscribe error:",
                    err
                );

            } else {

                console.log(
                    "Subscribed to status"
                );

            }

        }
    );

    enableButtons();

    messageElement.innerText =
        "Ready";

});


// =====================================================
// MQTT MESSAGE
// =====================================================

client.on("message", function (
    topic,
    payload
) {

    if (topic !== statusTopic)
        return;

    const status =
        payload.toString();

    console.log(
        "STATUS:",
        status
    );

    updateStatus(status);

});


// =====================================================
// CONNECTION LOST
// =====================================================

client.on("offline", function () {

    console.log(
        "MQTT offline"
    );

    connectionElement.innerText =
        "● MQTT OFFLINE";

    connectionElement.style.background =
        "#6b1d1d";

    disableButtons();

    statusElement.innerText =
        "OFFLINE";

});


// =====================================================
// MQTT ERROR
// =====================================================

client.on("error", function (error) {

    console.error(
        "MQTT error:",
        error
    );

    connectionElement.innerText =
        "MQTT ERROR";

    connectionElement.style.background =
        "#6b1d1d";

});


// =====================================================
// RECONNECTING
// =====================================================

client.on("reconnect", function () {

    console.log(
        "Attempting MQTT reconnect..."
    );

    connectionElement.innerText =
        "● RECONNECTING...";

    connectionElement.style.background =
        "#665400";

    disableButtons();

});


// =====================================================
// SEND COMMAND
// =====================================================

function sendCommand(command) {

    if (!client.connected) {

        messageElement.innerText =
            "MQTT is not connected";

        return;

    }

    console.log(
        "Sending:",
        command
    );

    client.publish(
        commandTopic,
        command,
        {
            qos: 1
        }
    );

    messageElement.innerText =
        "Command sent: " + command;

}


// =====================================================
// UPDATE STATUS
// =====================================================

function updateStatus(status) {

    statusElement.innerText =
        status;

    if (status === "EXTENDING") {

        messageElement.innerText =
            "Actuator extending";

    }

    else if (status === "RETRACTING") {

        messageElement.innerText =
            "Actuator retracting";

    }

    else if (status === "STOPPED") {

        messageElement.innerText =
            "Actuator stopped";

    }

    else if (status === "FAULT") {

        messageElement.innerText =
            "FAULT - check actuator";

    }

    else {

        messageElement.innerText =
            status;

    }

}


// =====================================================
// ENABLE BUTTONS
// =====================================================

function enableButtons() {

    extendButton.disabled = false;

    stopButton.disabled = false;

    retractButton.disabled = false;

}


// =====================================================
// DISABLE BUTTONS
// =====================================================

function disableButtons() {

    extendButton.disabled = true;

    stopButton.disabled = true;

    retractButton.disabled = true;

}

</script>

</body>
</html>
